name: Update feed and page

on:
  schedule:
    # GitHub's minimum is 5 minutes, and scheduled runs can be late under load.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        # The site's address comes from docs/CNAME (the Pages custom domain), else the github.io address.
        # data/dates.json keeps each article's real publish date, so only new articles are fetched.
        run: |
          if [ -s docs/CNAME ]; then SITE_URL="https://$(tr -d '[:space:]' < docs/CNAME)"; else SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"; fi
          mkdir -p data
          python3 chelsea_rss.py --out docs/feed.xml --limit 30 --self-url "$SITE_URL/feed.xml" --dates data/dates.json

      - name: Render the page from the feed
        run: python3 render_html.py --feed docs/feed.xml --out docs/index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/index.html data/dates.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update feed and page [skip ci]"
            git push
          fi
