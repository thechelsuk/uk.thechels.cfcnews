name: Update feed and page

on:
  schedule:
    # GitHub's minimum is 5 minutes, and scheduled runs can be late under load.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set the SITE_URL repository variable (for example https://cfcnews.thechels.uk) once the custom domain is live.
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        run: python3 chelsea_rss.py --out docs/feed.xml --limit 30 --self-url "$SITE_URL/feed.xml"

      - name: Render the page from the feed
        run: python3 render_html.py --feed docs/feed.xml --out docs/index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update feed and page [skip ci]"
            git push
          fi
